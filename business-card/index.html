<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Business Card</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="A pink Black-eyed Susan flower."></img>
        <p class="full-name">Lauren Franklin</p>
        <p class="designation">Multi-hyphenate</p>
        <p class="company">@Museum-of-Laurels</p>
        <hr>
      
        <p>Email: your-email@example.com</p>
        <p>(884) 572-8573</p>
        <a class="portfolio-link" href="https://www.midriffseason.com/">Portfolio</a>
        <hr>
      
        <div class="social-media">
            <h2>Connect with me!</h2>
            <a href="https://x.com/">Twitter</a>
            <a href="https://www.linkedin.com/">LinkedIn</a>
            <a href="https://github.com/">Github</a>
        </div>
    </div>
</body>

</html>
